#Thu Jul 23 12:10:34 UTC 2026
micronaut.application.name=demo

# Dependency Services Configuration
mongodb.uri=mongodb://admin:password@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/training?authSource=admin
rabbitmq.uri=amqp://localhost:5672

micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:public

# Micronaut HTTP File Upload Configuration
micronaut.server.multipart.enabled=true
micronaut.server.multipart.max-file-size=10485760
micronaut.server.max-request-size=10485760


# Micronaut HTTP Client Configuration
lambda.parser.url=http://localhost:8080/document-parser
micronaut.http.services.document-parser.connect-timeout=5s
micronaut.http.services.document-parser.read-timeout=10s